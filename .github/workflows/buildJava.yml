name: "Java CI with Maven - Test and package"

on:
  pull_request:
    branches:
      - main

jobs:
  buildJava:
    name: buildJava
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java SDK 21
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 21

      - name: Build with Maven
        run: mvn -B package
